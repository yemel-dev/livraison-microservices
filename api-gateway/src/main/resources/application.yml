server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: colis-service
          uri: ${COLIS_SERVICE_URL:http://colis-service:8082}
          predicates:
            - Path=/api/colis/**
        - id: livreur-service
          uri: ${LIVREUR_SERVICE_URL:http://livreur-service:8083}
          predicates:
            - Path=/api/livreurs/**, /api/livraisons/**

jwt:
  secret: ${JWT_SECRET:dev-secret-key-changer-en-production-minimum-32-chars}

gateway:
  public-paths: /api/auth/login,/api/auth/register,/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.livraison.gateway: DEBUG
    org.springframework.cloud.gateway: INFO