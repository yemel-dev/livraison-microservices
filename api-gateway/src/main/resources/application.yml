server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: colis-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/colis/**
        - id: livreur-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/livreurs/**, /api/livraisons/**

jwt:
  secret: ${JWT_SECRET:dev-secret-key-changer-en-production-minimum-32-chars}

gateway:
  public-paths: /api/auth/login,/api/auth/register,/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.livraison.gateway: DEBUG
    org.springframework.cloud.gateway: INFO