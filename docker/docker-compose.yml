
services:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - livraison-network

  mysql-users:
    image: mysql:8.0
    container_name: mysql-users
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-users-data:/var/lib/mysql
    networks:
      - livraison-network

  mysql-colis:
    image: mysql:8.0
    container_name: mysql-colis
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: colis_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-colis-data:/var/lib/mysql
    networks:
      - livraison-network

  mysql-livreurs:
    image: mysql:8.0
    container_name: mysql-livreurs
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: livreurs_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-livreurs-data:/var/lib/mysql
    networks:
      - livraison-network

  colis-service:
    build:
      context: ..                               # ← Remonte vers la racine du projet
      dockerfile: colis-service/Dockerfile
    container_name: colis-service
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-colis:3306/colis_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mysql-colis
      - kafka
    networks:
      - livraison-network
    restart: on-failure

volumes:
  mysql-users-data:
  mysql-colis-data:
  mysql-livreurs-data:

networks:
  livraison-network:
    driver: bridge