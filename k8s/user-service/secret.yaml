  db-username: cm9vdA==

  # echo -n "root" | base64
  db-password: cm9vdA==

  # echo -n "votre-cle-secrete-jwt-a-changer-en-production" | base64
  jwt-secret: dm90cmUtY2xlLXNlY3JldGUtand0LWEtY2hhbmdlci1lbi1wcm9kdWN0aW9u