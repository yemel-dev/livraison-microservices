apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-colis
  namespace: livraison
spec:
  selector:
    matchLabels:
      app: mysql-colis
  serviceName: mysql-colis
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql-colis
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: colis_db
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-colis
  namespace: livraison
spec:
  selector:
    app: mysql-colis
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None