apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: livraison
  labels:
    app: api-gateway
# Opaque = secret générique clé/valeur encodé en base64
type: Opaque
data:
  # Valeur : "dev-secret-key-changer-en-production-minimum-32-chars"
  # Encodée en base64 : echo -n "valeur" | base64
  jwt-secret: ZGV2LXNlY3JldC1rZXktY2hhbmdlci1lbi1wcm9kdWN0aW9uLW1pbmltdW0tMzItY2hhcnM=

# ⚠️  NE JAMAIS pousser ce fichier sur GitHub
# Ajouter dans .gitignore : k8s/*/secret.yaml
# En production, créer via :
#   kubectl create secret generic gateway-secret \
#     --from-literal=jwt-secret=VOTRE_SECRET_FORT \
#     --namespace=livraison