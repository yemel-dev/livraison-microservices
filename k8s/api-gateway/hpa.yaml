apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: livraison
  labels:
    app: api-gateway
spec:
  # Cible le Deployment api-gateway
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway

  # Nombre de replicas : minimum 2, maximum 5
  minReplicas: 2
  maxReplicas: 5

  # Déclencheur : CPU > 70% en moyenne sur tous les pods
  # K8s ajoute des replicas automatiquement jusqu'à maxReplicas
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70