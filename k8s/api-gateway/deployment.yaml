apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: livraison

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: livraison/api-gateway:1.0

          ports:
            - containerPort: 8080

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: jwt-secret

---
apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: livraison

spec:
  selector:
    app: api-gateway

  ports:
    - port: 8080
      targetPort: 8080

  type: LoadBalancer