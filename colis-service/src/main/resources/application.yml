server:
  port: 8082

spring:
  application:
    name: colis-service

  datasource:
    url: jdbc:mysql://localhost:3307/colis_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update       # En dev : crée/met à jour le schéma automatiquement
    show-sql: true           # Affiche les requêtes SQL en console (pratique en dev)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false   # Évite les problèmes de désérialisation côté consommateur

logging:
  level:
    com.livraison.colis: DEBUG
    org.hibernate.SQL: DEBUG