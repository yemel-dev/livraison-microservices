server:
  port: 8082

spring:
  application:
    name: colis-service

  datasource:
    url: jdbc:mysql://localhost:3307/colis_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false        # Supprime le warning "open-in-view is enabled by default"
    properties:
      hibernate:
        format_sql: true
        # MySQL8Dialect déprécié → on laisse Hibernate le détecter automatiquement

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

logging:
  level:
    com.livraison.colis: DEBUG
    org.hibernate.SQL: DEBUG